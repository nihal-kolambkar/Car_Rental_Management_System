<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Fleet | LCR Admin</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    body { display: flex; min-height: 100vh; background-color: var(--bg-primary); margin: 0; }
    .sidebar { width: 250px; background: var(--bg-secondary); border-right: 1px solid var(--border-color); padding: 2rem 1rem; position: fixed; height: 100vh; overflow-y: auto; }
    .main-content { flex: 1; margin-left: 250px; padding: 2rem; }
    .sidebar-nav { list-style: none; padding: 0; margin-top: 2rem; }
    .sidebar-nav li { margin-bottom: 0.5rem; }
    .sidebar-nav a { display: block; padding: 1rem; color: var(--text-secondary); text-decoration: none; border-radius: 8px; transition: var(--transition); }
    .sidebar-nav a:hover, .sidebar-nav a.active { background: rgba(255,255,255,0.05); color: var(--text-primary); }
    .sidebar-nav a.active { border-left: 4px solid #d4af37; }
    .dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem; }
    
    .btn-admin { background: #d4af37; color: #000; padding: 0.5rem 1rem; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .btn-admin:hover { background: #e5c158; }

    .form-panel { background: var(--bg-secondary); padding: 2rem; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 2rem; }
    .form-panel h2 { margin-bottom: 1.5rem; font-size: 1.5rem; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { padding: 1rem; text-align: left; border-bottom: 1px solid var(--border-color); }
    th { color: var(--text-secondary); font-weight: 500; }
    tr:hover { background: rgba(255,255,255,0.02); }
    
    .file-upload { border: 2px dashed var(--border-color); padding: 2rem; text-align: center; border-radius: 8px; cursor: pointer; color: var(--text-secondary); margin-bottom: 1rem; }
    .file-upload:hover { border-color: #d4af37; color: var(--text-primary); }
    #previewImage { max-width: 200px; max-height: 150px; border-radius: 8px; display: none; margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="sidebar">
    <a href="admin-dashboard.html" class="logo" style="margin-left: 1rem;">LCR<span style="color: #d4af37;">.Admin</span></a>
    <ul class="sidebar-nav">
      <li><a href="admin-dashboard.html">Overview</a></li>
      <li><a href="admin-users.html">Registered Users</a></li>
      <li><a href="admin-cars.html" class="active">Manage Fleet</a></li>
      <li><a href="admin-bookings.html">Booking Requests</a></li>
      <li><a href="index.html" style="margin-top: 2rem; color: #ef4444;">Logout</a></li>
    </ul>
  </div>

  <div class="main-content">
    <div class="dashboard-header">
      <h1>Manage Fleet</h1>
      <button class="btn-admin" onclick="document.getElementById('addCarForm').style.display='block'">+ Add New Car</button>
    </div>

    <div id="addCarForm" class="form-panel" style="display: none;">
      <h2>Add / Update Vehicle</h2>
      <form onsubmit="event.preventDefault(); alert('Car saved successfully!'); this.reset(); document.getElementById('previewImage').style.display='none'; document.getElementById('addCarForm').style.display='none';">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem;">
          <div class="form-group">
            <label>Car Name / Model</label>
            <input type="text" placeholder="e.g. Ares GT Sport" required>
          </div>
          <div class="form-group">
            <label>Price per Day ($)</label>
            <input type="number" placeholder="e.g. 250" required>
          </div>
          <div class="form-group">
            <label>Horsepower</label>
            <input type="number" placeholder="e.g. 550">
          </div>
          <div class="form-group">
            <label>Seats</label>
            <input type="number" placeholder="e.g. 2">
          </div>
        </div>
        
        <div class="form-group">
          <label>Upload Car Photo</label>
          <div class="file-upload" onclick="document.getElementById('fileInput').click()">
            <span>Click to upload image (JPG, PNG, WebP)</span>
            <input type="file" id="fileInput" style="display: none;" accept="image/*" onchange="previewFile()">
          </div>
          <img id="previewImage" src="" alt="Preview">
        </div>

        <button type="submit" class="btn-admin">Save Vehicle</button>
        <button type="button" class="btn-outline" style="margin-left: 1rem;" onclick="document.getElementById('addCarForm').style.display='none'">Cancel</button>
      </form>
    </div>

    <div class="form-panel">
      <h2>Current Inventory</h2>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Image</th>
            <th>Model Name</th>
            <th>Price/Day</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>#101</td>
            <td><img src="images/car_sport_1778313498515.png" style="width: 60px; border-radius: 4px;"></td>
            <td>Ares GT Sport</td>
            <td>$250</td>
            <td><span style="color: #10b981;">Available</span></td>
            <td>
              <button class="btn-outline" style="padding: 0.25rem 0.75rem; font-size: 0.8rem;">Edit</button>
            </td>
          </tr>
          <tr>
            <td>#102</td>
            <td><img src="images/car_suv_1778313477078.png" style="width: 60px; border-radius: 4px;"></td>
            <td>Titan Lux SUV</td>
            <td>$180</td>
            <td><span style="color: #3b82f6;">Rented</span></td>
            <td>
              <button class="btn-outline" style="padding: 0.25rem 0.75rem; font-size: 0.8rem;">Edit</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    function previewFile() {
      const preview = document.getElementById('previewImage');
      const file = document.getElementById('fileInput').files[0];
      const reader = new FileReader();

      reader.addEventListener("load", function () {
        preview.src = reader.result;
        preview.style.display = "block";
      }, false);

      if (file) {
        reader.readAsDataURL(file);
      }
    }
  </script>
</body>
</html>
